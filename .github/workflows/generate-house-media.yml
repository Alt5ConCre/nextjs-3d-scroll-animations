name: Generate Luxury House Media

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/render-house-media.py
      - .github/workflows/generate-house-media.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install render dependencies
        run: python -m pip install pillow numpy
      - name: Render 4K master and mobile chapter clips
        run: python scripts/render-house-media.py
      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/house/poster.webp public/house/media/luxury-house-master-4k.mp4 public/house/mobile/*.mp4
          git diff --cached --quiet && exit 0
          git commit -m "chore: add generated luxury house walkthrough media [skip ci]"
          git push
