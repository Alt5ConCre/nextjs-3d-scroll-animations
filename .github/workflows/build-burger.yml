name: Build Cinematic Burger

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/create_cinematic_burger.py"
      - ".github/workflows/build-burger.yml"

permissions:
  contents: write

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Blender 5.2
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "5.2"

      - name: Generate burger scene and GLB
        run: blender --background --factory-startup --python scripts/create_cinematic_burger.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/burger_cinematic.glb public/assets/burger_cinematic_preview.png public/assets/burger_cinematic_source.blend
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "Generate cinematic burger Blender assets"
          git push
